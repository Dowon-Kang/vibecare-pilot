openapi: 3.1.0
info:
  title: VibeCare API
  version: 0.7.0
  description: Canonical mobile API. FITRUS credentials never cross this boundary.
servers:
  - url: https://api.example.invalid
    description: Replace per environment
security:
  - bearerAuth: []
paths:
  /v1/research/smm-frequency-preview:
    post:
      summary: SMM frequency research comparison, never an execution authorization
      description: Uses the signed-in participant's latest four valid stored records from the selected source device. Existing provenance, safety, feedback and tier-instability gates remain active. No FITRUS call, database write or device command. The mobile pilot algorithm is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourceDeviceId, safety]
              properties:
                sourceDeviceId: { type: string, minLength: 1, maxLength: 200 }
                safety: { $ref: '#/components/schemas/SafetyCheck' }
      responses:
        '200':
          description: Unvalidated numerical preview only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmmFrequencyPreview' }
        '400': { description: Invalid request or client-submitted profile/muscle overrides }
        '401': { description: Authentication required }
        '404': { description: Participant not found }
        '409':
          description: Data review or current/persisted safety hold; preview is null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmmFrequencyPreview' }
        '503': { description: No enabled valid source rule set }
  /health:
    get:
      security: []
      responses:
        '200': { description: Process liveness; does not assert dependency readiness }
  /ready:
    get:
      security: []
      description: Deployment readiness. Returns 503 when configuration or the database is unavailable.
      responses:
        '200': { description: Runtime configuration and database checks passed }
        '503': { description: One or more readiness checks failed }
  /v1/auth/pin:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantCode, pin]
              properties:
                participantCode: { type: string }
                pin: { type: string, pattern: '^\d{6}$' }
      responses:
        '200': { description: Access and refresh tokens }
        '401': { description: Invalid credentials }
        '423': { description: Locked for 15 minutes after five failures }
  /v1/auth/refresh:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 20 }
      responses:
        '200':
          description: New 15-minute access token; the refresh token itself is not rotated
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresInSec]
                properties:
                  accessToken: { type: string }
                  expiresInSec: { type: integer, const: 900 }
        '400': { description: Invalid JSON, missing token, or authentication secret unavailable }
        '401': { description: Invalid or revoked refresh token }
  /v1/algorithm-rules/current:
    get:
      responses:
        '200': { description: Active validated AlgorithmRuleSet }
        '503': { description: No enabled valid rule set; execution is disabled }
  /v1/fitrus/measurements/{kind}:
    post:
      description: Server-only FITRUS proxy. The payload must match the selected provider endpoint contract. Valid body-composition and vital responses are inserted into history; unsupported or model-error responses remain raw only.
      parameters:
        - in: path
          name: kind
          required: true
          schema:
            enum: [bodyFat, bloodPressure, heartRate, stress, stressV2, bodyTemperature]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, payload]
              properties:
                deviceId: { type: string }
                measuredAt: { type: string, format: date-time }
                muscleProvenance:
                  description: Required when kind=bodyFat. UNKNOWN, empty references, or a method/evidence/definition triple absent from the active rule's applicableMethods cannot become simulation-eligible.
                  type: object
                  required: [muscleDefinition, definitionRef, muscleMeasurementMethod, methodEvidenceRef, muscleMassUnit, acquisitionProtocol]
                  properties:
                    muscleDefinition: { type: string, enum: [UNKNOWN, ASM, SMM] }
                    definitionRef: { type: string, minLength: 1 }
                    muscleMeasurementMethod: { type: string, minLength: 1 }
                    methodEvidenceRef: { type: string, minLength: 1 }
                    muscleMassUnit: { const: kg }
                    acquisitionProtocol: { type: string, minLength: 1 }
                payload:
                  description: Must match the schema for kind. PPG list length/range remains device-spec dependent.
                  oneOf:
                    - { $ref: '#/components/schemas/FitrusBloodPressureRequest' }
                    - { $ref: '#/components/schemas/FitrusHeartRateRequest' }
                    - { $ref: '#/components/schemas/FitrusStressRequest' }
                    - { $ref: '#/components/schemas/FitrusStressV2Request' }
                    - { $ref: '#/components/schemas/FitrusBodyTemperatureRequest' }
                    - { $ref: '#/components/schemas/FitrusBodyFatRequest' }
      responses:
        '201': { description: Raw response retained. normalized indicates whether a validated history record was also inserted. }
        '400': { description: Invalid wrapper or endpoint-specific FITRUS payload }
        '409': { description: Body-fat demographics do not match the authenticated participant profile }
        '502': { description: FITRUS rejected the request or could not be reached }
        '504': { description: FITRUS did not respond before the server timeout }
  /v1/participants/me/measurement-set/current:
    get:
      description: Returns the latest 20 history records plus any older records in the selected four (at most 24). Selection uses the requested source device, measuredAt descending, then ID descending.
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        '200': { description: Current body-composition set }
  /v1/participants/me/vitals:
    get:
      responses:
        '200': { description: Display-only vital history }
  /v1/recommendations/authorize:
    post:
      description: pilot-0.8.0 accepts four provenance-matched SMM measurements and a body part. It applies configurable prototype gender, age, and body-fat coefficients to the selected part baseline. Physical execution is always PROHIBITED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [measurementIds, safety, deviceId, algorithmVersion, bodyPart]
              properties:
                measurementIds:
                  type: array
                  minItems: 4
                  maxItems: 4
                  uniqueItems: true
                  items: { type: string }
                safety: { $ref: '#/components/schemas/SafetyCheck' }
                deviceId: { type: string }
                sourceDeviceId:
                  type: string
                  minLength: 1
                  description: BIA measurement source device. Legacy callers may omit it to use deviceId. deviceId identifies the target simulator.
                algorithmVersion: { type: string }
                bodyPart:
                  type: string
                  enum: [wholeBody, shoulder, arm, abdomen, thigh, calf]
                  description: Selects the configured time, frequency, and baseline device-output setting. All four measurements must have confirmed SMM provenance.
                requestedIntensityPct:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Optional device output setting in percent of the device's own output scale. The server accepts only values between its configured minimum and calculated recommendation. This is not a measured physical output.
      responses:
        '201':
          description: One-time 60-second mock authorization.
          content:
            application/json:
              schema:
                type: object
                required: [authorized, mode, authorizationId, recommendationId, expiresAt, result]
                properties:
                  authorized: { const: true }
                  mode: { const: mock }
                  authorizationId: { type: string }
                  recommendationId: { type: string }
                  expiresAt: { type: string, format: date-time }
                  result: { $ref: '#/components/schemas/AlgorithmResult' }
        '409': { description: 'Non-SMM or mixed provenance, stale/future data under the labelled engineering policy, safety block, physical mode, intensity range, or algorithm version mismatch.' }
        '400': { description: Invalid input or missing explicit safety answers }
        '503': { description: Algorithm unavailable }
  /v1/device-sessions:
    post:
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorizationId, deviceId]
              properties:
                authorizationId: { type: string, minLength: 1 }
                deviceId: { type: string, minLength: 1 }
      responses:
        '201': { description: Mock session started and ACK recorded }
        '200': { description: Same participant and identical request replayed with the same key }
        '400': { description: Missing or short Idempotency-Key, or invalid request body }
        '401': { description: Missing or invalid access token }
        '404': { description: Execution authorization not found for this participant and device }
        '409': { description: 'Expired or used authorization, conflicting key, busy target device, or changed algorithm' }
        '503': { description: Algorithm unavailable }
        '501': { description: Real device protocol is not configured }
  /v1/device-sessions/{id}/events:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType]
              properties:
                eventType:
                  type: string
                  enum: [ACK, RUNNING, STOPPING, COMPLETED, ERROR, DISCONNECTED]
                payload:
                  type: object
                  additionalProperties: true
                  default: {}
      responses:
        '202': { description: Simulator event accepted; COMPLETED closes the session }
        '400': { description: Invalid event type or payload }
        '401': { description: Missing or invalid access token }
        '404': { description: Session not found for the authenticated participant }
        '409': { description: Session already terminal }
  /v1/device-sessions/{id}/stop:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': { description: STOPPED or COMPLETED confirmed; terminal calls are idempotent }
        '400': { description: Missing or invalid stop reason }
        '401': { description: Missing or invalid access token }
        '404': { description: Session not found for the authenticated participant }
  /v1/feedback-adjustment:
    get:
      description: Returns the participant's current conservative feedback adjustment, or null when no completed-session feedback exists.
      responses:
        '200':
          description: Current feedback adjustment
          content:
            application/json:
              schema:
                type: object
                required: [adjustment]
                properties:
                  adjustment:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [intensityCap, requiresReview, reason, reasonCode, policyVersion, sourceSessionId]
                        properties:
                          intensityCap: { type: number, minimum: 0, maximum: 100 }
                          requiresReview: { type: boolean }
                          reason: { type: string }
                          reasonCode: { type: string }
                          policyVersion: { type: string }
                          sourceSessionId: { type: string }
        '401': { description: Missing or invalid access token }
  /v1/session-feedback:
    post:
      description: Idempotent by participant and session; conflicting retries rejected. policyVersion feedback-0.2.0 and reasonCode accompany the adjustment. Physical telemetry is nullable and participant-reported, not device-attested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, rpe, pain, dizziness]
              properties:
                sessionId: { type: string }
                rpe: { type: integer, minimum: 0, maximum: 10 }
                pain: { type: integer, minimum: 0, maximum: 10 }
                dizziness: { type: boolean }
                intensityRating: { type: string, enum: [weak, suitable, strong] }
                durationRating: { type: string, enum: [weak, suitable, strong] }
                frequencyRating: { type: string, enum: [weak, suitable, strong] }
                discomfort:
                  type: [string, 'null']
                  maxLength: 500
                  description: Optional participant-entered discomfort note
                earlyStopped: { type: boolean }
                actualDurationSec: { type: [number, 'null'], minimum: 0 }
                measuredPeakG: { type: [number, 'null'], minimum: 0 }
                measuredRmsG: { type: [number, 'null'], minimum: 0 }
      responses:
        '200': { description: Feedback stored }
        '400': { description: Invalid feedback values }
        '401': { description: Missing or invalid access token }
        '404': { description: Session not found for the authenticated participant }
        '409': { description: Conflicting feedback or non-terminal session }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SmmFrequencyPreview:
      type: object
      additionalProperties: false
      required: [modelVersion, sourceRuleVersion, evidence, status, authorized, physicalExecution, realDeviceSendAllowed, reasonCodes, preview]
      properties:
        modelVersion: { const: smm-frequency-research-0.1.0 }
        sourceRuleVersion: { type: string }
        evidence: { const: HYPOTHESIS_UNVALIDATED }
        status: { enum: [PREVIEW_ONLY, REVIEW, BLOCKED] }
        authorized: { const: false }
        physicalExecution: { const: PROHIBITED }
        realDeviceSendAllowed: { const: false }
        reasonCodes: { type: array, items: { type: string } }
        preview:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [basis, selectedModel, selectionBasis, meanSmmKg, indexKgM2, bodyFatPct, bmi, lowerIndex, upperIndex, candidatesHz, frequencyHz, observedRangeHz, maximumSlopeHzPerKg, measurements]
              properties:
                basis: { const: SMM }
                selectedModel: { const: linear }
                selectionBasis: { const: NUMERICAL_SENSITIVITY_NOT_CLINICAL_EFFECT }
                meanSmmKg: { type: number }
                indexKgM2: { type: number }
                bodyFatPct: { type: number }
                bmi: { type: number }
                lowerIndex: { type: number }
                upperIndex: { type: number }
                candidatesHz:
                  type: object
                  additionalProperties: false
                  required: [fixed, step, linear, smoothstep]
                  properties:
                    fixed: { type: number, minimum: 12, maximum: 20 }
                    step: { type: number, minimum: 12, maximum: 20 }
                    linear: { type: number, minimum: 12, maximum: 20 }
                    smoothstep: { type: number, minimum: 12, maximum: 20 }
                frequencyHz: { type: number, minimum: 12, maximum: 20 }
                observedRangeHz:
                  type: object
                  additionalProperties: false
                  required: [minimum, maximum, meaning]
                  properties:
                    minimum: { type: number }
                    maximum: { type: number }
                    meaning: { const: OBSERVED_SPREAD_NOT_CONFIDENCE_INTERVAL }
                maximumSlopeHzPerKg: { type: number }
                measurements:
                  type: array
                  minItems: 4
                  maxItems: 4
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, measuredAt]
                    properties:
                      id: { type: string }
                      measuredAt: { type: string, format: date-time }
    FitrusPpgList:
      type: array
      minItems: 1
      items: { type: integer }
      description: Interleaved red/green/IR integers. The provider has not supplied a valid sample count or item range.
    FitrusBloodPressureRequest:
      type: object
      required: [list, baseSystolic, baseDiastolic]
      properties:
        list: { $ref: '#/components/schemas/FitrusPpgList' }
        baseSystolic: { type: number, exclusiveMinimum: 0 }
        baseDiastolic: { type: number, exclusiveMinimum: 0 }
    FitrusHeartRateRequest:
      type: object
      required: [list]
      properties:
        list: { $ref: '#/components/schemas/FitrusPpgList' }
    FitrusStressRequest:
      type: object
      required: [list, age]
      properties:
        list: { $ref: '#/components/schemas/FitrusPpgList' }
        age: { type: integer, minimum: 1 }
    FitrusStressV2Request:
      $ref: '#/components/schemas/FitrusHeartRateRequest'
    FitrusBodyTemperatureRequest:
      type: object
      required: [temp]
      properties:
        temp: { type: number }
    FitrusBodyFatRequest:
      type: object
      required: [age, height, weight, gender, voltage]
      properties:
        age: { type: integer, minimum: 1 }
        height: { type: number, exclusiveMinimum: 0 }
        weight: { type: number, exclusiveMinimum: 0 }
        gender: { type: string, enum: [male, female], description: Case-insensitive on input }
        voltage: { type: number }
        correct: { type: [number, 'null'], default: 0 }
    AlgorithmResult:
      type: object
      required: [status, executionStatus, dataDecision, simulationEligibility, physicalExecution, realDeviceSendAllowed, reasonCodes, warnings, algorithmVersion, bodyPart, muscleMassBasis, average, recommendation, factors]
      properties:
        status: { type: string, enum: [READY, REVIEW, BLOCKED] }
        executionStatus: { type: string, enum: [SIMULATION_READY, REVIEW, BLOCKED] }
        dataDecision: { type: string, enum: [ACCEPTED, REVIEW_REQUIRED, BLOCKED] }
        simulationEligibility: { type: string, enum: [ELIGIBLE, INELIGIBLE] }
        physicalExecution: { const: PROHIBITED }
        realDeviceSendAllowed: { const: false }
        algorithmVersion: { const: pilot-0.8.0 }
        bodyPart: { type: string, enum: [wholeBody, shoulder, arm, abdomen, thigh, calf] }
        muscleMassBasis: { const: SMM }
        reasonCodes: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        average:
          oneOf:
            - type: 'null'
            - type: object
              required: [weightKg, bmi, bodyFatPct, fatMassKg, skeletalMuscleMassKg]
              properties:
                weightKg: { type: number }
                bmi: { type: number }
                bodyFatPct: { type: number }
                fatMassKg: { type: number }
                skeletalMuscleMassKg: { type: number }
        recommendation:
          oneOf:
            - type: 'null'
            - type: object
              required: [purpose, evidence, durationSec, frequencyHz, intensityPct, baseIntensityPct]
              properties:
                purpose: { const: SIMULATION_CANDIDATE }
                evidence: { const: HYPOTHESIS_UNVALIDATED }
                durationSec: { type: integer, minimum: 1 }
                frequencyHz: { type: integer, minimum: 1 }
                intensityPct: { type: number, minimum: 0, maximum: 100 }
                baseIntensityPct: { type: number, minimum: 0, maximum: 100 }
        factors:
          oneOf:
            - type: 'null'
            - type: object
              required: [genderCoefficient, ageCoefficient, bodyFatCoefficient, muscleMassCoefficient, totalCoefficient, calculatedIntensityPct, bodyFatBand]
              properties:
                genderCoefficient: { type: number, exclusiveMinimum: 0, maximum: 1 }
                ageCoefficient: { type: number, exclusiveMinimum: 0, maximum: 1 }
                bodyFatCoefficient: { type: number, exclusiveMinimum: 0, maximum: 1 }
                muscleMassCoefficient: { const: 1 }
                totalCoefficient: { type: number, exclusiveMinimum: 0, maximum: 1 }
                calculatedIntensityPct: { type: number, minimum: 0, maximum: 100 }
                bodyFatBand: { type: string, enum: [low, normal, high] }
    SafetyCheck:
      description: All three answers must be explicitly provided; null or omitted is not false. Any true answer blocks execution.
      type: object
      required: [acutePain, dizziness, clinicianHold]
      properties:
        acutePain: { type: boolean }
        dizziness: { type: boolean }
        clinicianHold: { type: boolean }
