# Keep Android builds stable on the 16 GB development PC even when the
# Windows page file cannot grow. Two workers are enough for this small app.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.overridePathCheck=true
android.newDsl=false
android.builtInKotlin=false
