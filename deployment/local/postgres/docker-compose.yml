services:
  postgres:
    image: postgres:16-alpine
    container_name: vibecare-postgres-local
    environment:
      POSTGRES_DB: vibecare
      POSTGRES_USER: vibecare
      POSTGRES_PASSWORD: vibecare_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecare -d vibecare"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - vibecare_postgres_data:/var/lib/postgresql/data

volumes:
  vibecare_postgres_data:
